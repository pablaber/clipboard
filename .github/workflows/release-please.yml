name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Migrate, configure, and deploy production
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          : "${SUPABASE_PROJECT_REF:?repository variable SUPABASE_PROJECT_REF is required}"
          : "${SUPABASE_DB_PASSWORD:?repository secret SUPABASE_DB_PASSWORD is required}"
          # `config push` resolves [remotes.*] against the linked project, so linking is what makes
          # the production override apply. The committed literal project_id must match this ref.
          grep -q "^project_id = \"$SUPABASE_PROJECT_REF\"$" supabase/config.toml || {
            echo "[remotes.production].project_id does not match SUPABASE_PROJECT_REF" >&2
            exit 1
          }
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview production database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --dry-run

      - name: Apply production database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --yes

      - name: Push production Supabase configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SMTP_ADMIN_EMAIL: ${{ vars.SUPABASE_SMTP_ADMIN_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODUCTION_HOSTNAME: ${{ vars.PRODUCTION_HOSTNAME }}
          SUPABASE_AUTH_SITE_URL: https://${{ vars.PRODUCTION_HOSTNAME }}
        run: |
          : "${PRODUCTION_HOSTNAME:?repository variable PRODUCTION_HOSTNAME is required}"
          : "${SUPABASE_SMTP_ADMIN_EMAIL:?repository variable SUPABASE_SMTP_ADMIN_EMAIL is required}"
          : "${RESEND_API_KEY:?repository secret RESEND_API_KEY is required}"
          before="$(sha256sum supabase/config.toml)"
          npx supabase config push --yes | tee config-push.log
          after="$(sha256sum supabase/config.toml)"
          if [ "$before" != "$after" ]; then
            echo "supabase/config.toml changed during config push" >&2
            exit 1
          fi
          # A silently ignored [remotes.production] block pushes the local profile instead. Fail
          # loudly rather than leaving production auth pointing at localhost.
          if grep -q "localhost" config-push.log; then
            echo "config push sent localhost values: the production remote was not selected" >&2
            exit 1
          fi
          rm -f config-push.log

      - name: Build Cloudflare output
        run: npm run build

      - name: Deploy the Worker to the production hostname
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in step with the wrangler version in package-lock.json.
          wranglerVersion: '4.151.1'
          command: deploy --domain ${{ vars.PRODUCTION_HOSTNAME }}
          secrets: |
            SUPABASE_URL
            SUPABASE_SECRET_KEY

      - name: Smoke-test the production site
        env:
          PRODUCTION_HOSTNAME: ${{ vars.PRODUCTION_HOSTNAME }}
        run: |
          for path in / /login; do
            curl --fail-with-body --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --output /dev/null \
              "https://$PRODUCTION_HOSTNAME$path"
          done
